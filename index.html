<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书院足球队</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">书院足球队</a>
        </div>
    </nav>

    <div class="container my-4">
        <!-- 球员列表 -->
        <h2 class="mb-3">球员名单</h2>
        <div class="row" id="playersList">
            <!-- 球员卡片示例 -->
            <div class="col-md-4">
                <div class="card player-card">
                    <img src="https://via.placeholder.com/300x200.png?text=球员1" alt="球员1">
                    <div class="card-body">
                        <h5 class="card-title">张三</h5>
                        <p class="card-text">前锋</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card player-card">
                    <img src="https://via.placeholder.com/300x200.png?text=球员2" alt="球员2">
                    <div class="card-body">
                        <h5 class="card-title">李四</h5>
                        <p class="card-text">中场</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card player-card">
                    <img src="https://via.placeholder.com/300x200.png?text=球员3" alt="球员3">
                    <div class="card-body">
                        <h5 class="card-title">王五</h5>
                        <p class="card-text">后卫</p>
                    </div>
                </div>
            </div>
        </div>

        <hr>

        <!-- 动态公告栏 -->
        <h2 class="mb-3">动态公告</h2>
        <ul class="list-group mb-3">
            <li class="list-group-item">5月15日，球队训练在操场B举行</li>
            <li class="list-group-item">下周比赛对阵邻校队，地点：体育场</li>
            <li class="list-group-item">队员张三入选校队名单</li>
        </ul>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
